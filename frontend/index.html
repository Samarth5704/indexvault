<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndexVault</title>
  <style>
    /* Placeholder until M2 builds the real shell and tokens.css. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #0b0e14; color: #e8ebf1; }
    main { text-align: center; padding: 16px; }
    a { color: #5b8cff; }
    code { color: #a3acbd; }
  </style>
</head>
<body>
  <main>
    <h1>IndexVault</h1>
    <p>The API is running. The interface arrives in Milestone 2.</p>
    <p><a href="/api/docs">API docs</a> · <code id="health">checking…</code></p>
  </main>
  <script type="module">
    const el = document.getElementById("health");
    try {
      const h = await (await fetch("/api/health")).json();
      el.textContent = `v${h.version} · source: ${h.source}`;
    } catch {
      el.textContent = "API not reachable";
    }
  </script>
</body>
</html>
